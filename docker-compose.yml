services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmap}
      POSTGRES_DB: ${POSTGRES_DB:-mindmap}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindmap}"]
      interval: 3s
      retries: 20

  minio:
    image: pgsty/minio:latest  # minio/minio больше не публикуется на Docker Hub
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  backend:
    build: ./backend
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mindmap}:${POSTGRES_PASSWORD:-mindmap}@db:5432/${POSTGRES_DB:-mindmap}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    volumes: ["./backend:/app"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["${APP_PORT:-5173}:5173"]
    environment:
      API_URL: http://backend:8000
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes: ["./frontend:/app", "frontend_modules:/app/node_modules"]

volumes:
  frontend_modules:
  pgdata:
  miniodata:
